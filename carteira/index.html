<style>
:root{
  --bg:#080b10; --panel:#111821; --panel2:#16202b; --line:#22303f;
  --txt:#e8eef5; --mut:#8ea3b9; --mut2:#61748a;
  --acc:#10b981; --acc2:#34d399; --red:#fb7185; --amb:#fbbf24; --blue:#60a5fa; --purple:#a78bfa;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%, rgba(16,185,129,.10), transparent 60%), var(--bg);
  color:var(--txt); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:var(--acc2);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.015em}
.app{display:flex;min-height:100vh}
/* SIDEBAR */
.sidebar{width:236px;flex:0 0 236px;background:linear-gradient(180deg,#0c1218,#090e13);border-right:1px solid var(--line);
  padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#0ea5e9);display:grid;place-items:center;font-weight:800;color:#04110c;font-size:16px}
.brand b{font-size:15px;letter-spacing:-.02em}
.brand small{display:block;color:var(--mut2);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--mut);
  cursor:pointer;font-size:14px;font-weight:500;border:1px solid transparent;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(16,185,129,.16),rgba(16,185,129,.03));color:var(--acc2);border-color:rgba(16,185,129,.25)}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:var(--mut2);border-top:1px solid var(--line)}
/* MAIN */
.main{flex:1;min-width:0;padding:22px 28px 90px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font-size:22px}
.topbar p{margin:3px 0 0;color:var(--mut);font-size:13px}
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input,select,textarea,button{font-family:inherit;font-size:14px}
input[type=month],input[type=date],input[type=text],input[type=number],select,textarea{
  background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(16,185,129,.13)}
input::placeholder{color:var(--mut2)}
.btn{background:var(--acc);color:#04110c;border:0;border-radius:10px;padding:10px 15px;font-weight:650;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:550}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.danger{background:rgba(251,113,133,.14);color:var(--red);border:1px solid rgba(251,113,133,.35)}
/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:linear-gradient(170deg,var(--panel),#0e151d);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:23px;font-weight:680;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--mut);margin-top:5px}
.pos{color:var(--acc2)} .neg{color:var(--red)} .warn{color:var(--amb)} .info{color:var(--blue)}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:1.35fr .85fr}
.g-2e{grid-template-columns:1fr 1fr}
@media(max-width:1050px){.g-2,.g-2e{grid-template-columns:1fr}}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card-h h3{font-size:14.5px}
.card-h span{font-size:12px;color:var(--mut)}
.sec-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin:26px 0 12px;font-weight:600}
/* LIST ROWS */
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.row .grow{flex:1;min-width:0}
.row .t1{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:11.5px;color:var(--mut);margin-top:2px}
.row .amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
/* PROGRESS */
.bar{height:8px;border-radius:99px;background:#1b2734;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .4s}
.bar.big{height:11px}
/* PILLS */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;letter-spacing:.01em}
.pill.ok{background:rgba(16,185,129,.14);color:var(--acc2)}
.pill.bad{background:rgba(251,113,133,.14);color:var(--red)}
.pill.warn{background:rgba(251,191,36,.14);color:var(--amb)}
.pill.mut{background:rgba(255,255,255,.06);color:var(--mut)}
/* TABLES */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut2);padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.045);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
/* TIPS */
.tip{display:flex;gap:11px;padding:12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);margin-bottom:9px}
.tip .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 26px;font-size:13px}
.tip b{font-size:13.5px;display:block;margin-bottom:2px}
.tip p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.5}
.ic.red{background:rgba(251,113,133,.15);color:var(--red)}
.ic.amb{background:rgba(251,191,36,.15);color:var(--amb)}
.ic.grn{background:rgba(16,185,129,.15);color:var(--acc2)}
.ic.blu{background:rgba(96,165,250,.15);color:var(--blue)}
/* EDU CARDS */
.edu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.edu-card{background:linear-gradient(170deg,var(--panel),#0d141b);border:1px solid var(--line);border-radius:13px;padding:15px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:8px}
.edu-card:hover{border-color:rgba(16,185,129,.45);transform:translateY(-2px)}
.edu-card h4{font-size:14px;line-height:1.35}
.edu-card p{margin:0;font-size:12.5px;color:var(--mut);flex:1}
.edu-card .meta{font-size:11px;color:var(--mut2);display:flex;justify-content:space-between}
.tag{font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(96,165,250,.14);color:var(--blue);font-weight:600;align-self:flex-start}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(3,6,10,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:620px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);margin:auto}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.modal .x{background:transparent;border:0;color:var(--mut);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px}
.modal .x:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.prose{font-size:14px;color:#cdd9e5;line-height:1.68}
.prose h4{margin:16px 0 6px;font-size:14px;color:var(--acc2)}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.prose li{margin-bottom:5px}
.prose b{color:#fff}
.prose .box{background:var(--panel2);border-left:3px solid var(--acc);border-radius:8px;padding:10px 13px;font-size:13px;margin:10px 0}
/* FORM */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fgrid .full{grid-column:1/-1}
label.f{display:block;font-size:11.5px;color:var(--mut);margin-bottom:5px;font-weight:600;letter-spacing:.03em}
label.f input,label.f select,label.f textarea{width:100%}
.seg{display:flex;gap:6px;background:var(--panel2);padding:4px;border-radius:10px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;color:var(--mut);padding:8px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--panel);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.seg button.on.rec{color:var(--acc2)} .seg button.on.des{color:var(--red)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
/* EMPTY */
.empty{padding:26px 10px;text-align:center;color:var(--mut2);font-size:13px}
/* LEGEND */
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .li .nm{flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .li b{font-variant-numeric:tabular-nums}
/* MOBILE NAV */
.mnav{display:none}
@media(max-width:860px){
  .sidebar{display:none}
  .main{padding:16px 14px 92px}
  .topbar h1{font-size:19px}
  .kpi .val{font-size:20px}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(10,15,20,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:90}
  .mnav .mi{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--mut2);font-size:9.5px;font-weight:600;cursor:pointer;border-radius:9px}
  .mnav .mi.on{color:var(--acc2)}
  .mnav .mi svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .fgrid{grid-template-columns:1fr}
}
@media(max-width:420px){.cards{grid-template-columns:1fr 1fr}.kpi .val{font-size:17px}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f1a24;border:1px solid var(--line);
  color:var(--txt);padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:300;opacity:0;transition:.25s;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:11.5px;color:var(--mut2);line-height:1.45}
.stat-mini{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.stat-mini:last-child{border:0}
.stat-mini span{color:var(--mut)}
.stat-mini b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:600}
.tabs button.on{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:var(--acc2)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div id="view"></div>
  </main>
</div>
<nav class="mnav" id="mnav"></nav>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   MINHA CARTEIRA — controle financeiro pessoal (offline, local)
   ============================================================ */
"use strict";

var LS = "minha_carteira_v1";
var uid = function (p) { return (p || "id") + Math.random().toString(36).slice(2, 9); };
var BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
var NUM = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
var fmt = function (v) { return BRL.format(Number(v) || 0); };
var fmtK = function (v) {
  var n = Number(v) || 0;
  if (Math.abs(n) >= 1000) return "R$ " + (n / 1000).toFixed(1).replace(".", ",") + "k";
  return "R$ " + NUM.format(n);
};
var pct = function (v) { return (Number(v) || 0).toFixed(1).replace(".", ",") + "%"; };
var MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
var MESESF = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); };

function toISO(d) { var p = function (n) { return String(n).padStart(2, "0"); }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
function hojeISO() { return toISO(new Date()); }
function mesDe(iso) { return String(iso || "").slice(0, 7); }
function diaDe(iso) { return String(iso || "").slice(8, 10); }
function nomeMes(m) { var a = String(m).split("-"); return MESESF[(+a[1] || 1) - 1] + "/" + a[0]; }
function mesCurto(m) { var a = String(m).split("-"); return MESES[(+a[1] || 1) - 1] + "/" + a[0].slice(2); }
function addMeses(m, n) { var a = String(m).split("-"), d = new Date(+a[0], +a[1] - 1 + n, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function mesPassado(m) { return addMeses(m, -1); }
function diasNoMes(m) { var a = String(m).split("-"); return new Date(+a[0], +a[1], 0).getDate(); }

function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  var s = String(v == null ? "" : v).trim().replace(/[^\d,.-]/g, "");
  if (!s) return 0;
  if (s.indexOf(",") > -1) s = s.replace(/\./g, "").replace(",", ".");
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

];

function estadoInicial() {
  return {
    versao: 1,
    config: { nome: "", rendaMensal: 0, custoEssencial: 0, metaReservaMeses: 6 },
    categorias: CAT_PADRAO.map(function (c, i) { return { nome: c.nome, tipo: c.tipo, orcamento: c.orcamento, cor: CORES[i % CORES.length] }; }),
    transacoes: [],

  };
}
function carregar() {
  try {
    var raw = localStorage.getItem(LS);
    if (!raw) return estadoInicial();
    var s = JSON.parse(raw);
    var base = estadoInicial();
    return Object.assign(base, s, { config: Object.assign(base.config, s.config || {}), reserva: Object.assign(base.reserva, s.reserva || {}) });
  } catch (e) { return estadoInicial(); }
}
var S = carregar();
function salvar() {
  try { localStorage.setItem(LS, JSON.stringify(S)); }
  catch (e) { toast("Não foi possível salvar. Exporte um backup."); }
}

function corCat(nome) {
  var c = S.categorias.find(function (x) { return x.nome === nome; });
  return c ? c.cor : "#94a3b8";
}
function catsDe(tipo) { return S.categorias.filter(function (c) { return c.tipo === tipo; }); }

/* ---------------- cálculos ---------------- */
function txMes(m) { return S.transacoes.filter(function (t) { return mesDe(t.data) === m; }); }
function soma(arr, tipo) {
  return arr.reduce(function (a, t) { return a + (tipo ? (t.tipo === tipo ? num(t.valor) : 0) : num(t.valor)); }, 0);
}
function receitas(m) { return soma(txMes(m), "receita"); }
function despesas(m) { return soma(txMes(m), "despesa"); }
function saldoMes(m) { return receitas(m) - despesas(m); }
function taxaPoupanca(m) { var r = receitas(m); return r > 0 ? (r - despesas(m)) / r : 0; }

function porCategoria(m) {
  var map = {};
  txMes(m).forEach(function (t) {
    if (t.tipo !== "despesa") return;
    var k = t.categoria || "Outros";
    map[k] = (map[k] || 0) + num(t.valor);
  });
  return Object.keys(map).map(function (k) { return { nome: k, valor: map[k], cor: corCat(k) }; })
    .sort(function (a, b) { return b.valor - a.valor; });
}
function gastoNaCategoria(m, nome) {
  return txMes(m).filter(function (t) { return t.tipo === "despesa" && t.categoria === nome; })
    .reduce(function (a, t) { return a + num(t.valor); }, 0);
}
function gastosFixos(m) {
  return txMes(m).filter(function (t) { return t.tipo === "despesa" && t.fixa; }).reduce(function (a, t) { return a + num(t.valor); }, 0);
}
function dividaMensal() { return S.dividas.reduce(function (a, d) { return a + num(d.valorParcela); }, 0); }
function dividaTotal() {
  return S.dividas.reduce(function (a, d) { return a + Math.max(0, saldoDevedor(d)); }, 0);
}
function saldoDevedor(d) {
  var pago = num(d.parcelasPagas) * num(d.valorParcela);
  return Math.max(0, num(d.valorTotal) - pago);
}
function rendaReferencia(m) {
  var r = receitas(m);
  if (r > 0) return r;
  var ult = 0;
  for (var i = 1; i <= 3; i++) { var x = receitas(addMeses(m, -i)); if (x > 0) { ult = x; break; } }
  return ult || num(S.config.rendaMensal);
}
function custoEssencial() {
  if (num(S.config.custoEssencial) > 0) return num(S.config.custoEssencial);
  var total = 0, n = 0;
  for (var i = 0; i < 3; i++) { var m = addMeses(mesDe(hojeISO()), -i); var d = despesas(m); if (d > 0) { total += d; n++; } }
  return n ? total / n : 0;
}
function metaReserva() { return custoEssencial() * (num(S.config.metaReservaMeses) || 6); }
function mesesReserva() {
  var c = custoEssencial();
  return c > 0 ? num(S.reserva.atual) / c : 0;
}
function simularQuitacao(d) {
  var saldo = saldoDevedor(d), pg = num(d.valorParcela), j = num(d.jurosMes) / 100;
  if (saldo <= 0 || pg <= 0) return { meses: 0, juros: 0, total: 0, ok: false };
  var meses = 0, juros = 0;
  while (saldo > 0.01 && meses < 600) {
    var enc = saldo * j; saldo += enc; juros += enc;
    saldo -= Math.min(pg, saldo + 1); meses++;
    if (pg <= saldo * j) return { meses: Infinity, juros: Infinity, total: Infinity, ok: false, eterna: true };
  }
  return { meses: meses, juros: juros, total: juros + num(d.valorTotal), ok: true };
}
function projecaoMeta(alvo, atual, aporte) {
  if (adulto(alvo) <= 0) return null;
  var falta = Math.max(0, alvo - atual);
  if (falta <= 0) return { meses: 0 };
  if (!aporte || aporte <= 0) return null;
  return { meses: Math.ceil(falta / aporte) };
}
function adulto(v) { return Number(v) || 0; }

/* ---------------- saúde financeira ---------------- */
function saude(m) {
  var r = receitas(m), d = despesas(m), renda = rendaReferencia(m);
  var itens = [];
  var tp = r > 0 ? (r - d) / r : 0;
  var p1 = clamp(tp / 0.20, 0, 1) * 30;
  itens.push({ nome: "Taxa de poupança", pts: p1, max: 30, detalhe: r > 0 ? pct(tp * 100) + " da renda guardada" : "sem receitas lançadas" });
  var alvo = metaReserva(), p2 = alvo > 0 ? clamp(num(S.reserva.atual) / alvo, 0, 1) : 0;
  itens.push({ nome: "Reserva de emergência", pts: p2 * 30, max: 30, detalhe: alvo > 0 ? pct(p2 * 100) + " da meta" : "defina seu custo essencial" });
  var comp = renda > 0 ? dividaMensal() / renda : 0;
  var p3 = clamp(1 - comp / 0.30, 0, 1) * 20;
  itens.push({ nome: "Endividamento", pts: p3, max: 20, detalhe: renda > 0 ? pct(comp * 100) + " da renda em parcelas" : "sem dívidas cadastradas" });
  var comLimite = catsDe("despesa").filter(function (c) { return num(c.orcamento) > 0; });
  var dentro = comLimite.filter(function (c) { return gastoNaCategoria(m, c.nome) <= num(c.orcamento); }).length;
  var p4 = comLimite.length ? (dentro / comLimite.length) * 10 : 5;
  itens.push({ nome: "Orçamento do mês", pts: p4, max: 10, detalhe: comLimite.length ? dentro + " de " + comLimite.length + " categorias no limite" : "nenhum limite definido" });
  var n = txMes(m).length;
  var p5 = clamp(n / 8, 0, 1) * 10;
  itens.push({ nome: "Controle dos lançamentos", pts: p5, max: 10, detalhe: n + " lançamentos no mês" });
  var total = itens.reduce(function (a, i) { return a + i.pts; }, 0);
  return { total: Math.round(total), itens: itens };
}
function faixaScore(s) {
  if (s >= 85) return { t: "Excelente", c: "ok", d: "Você está no caminho da independência financeira." };
  if (s >= 70) return { t: "Bom", c: "ok", d: "Boa base. Ajustes finos aceleram muito o resultado." };
  if (s >= 50) return { t: "Regular", c: "warn", d: "Dá para melhorar com foco em reserva e cortes pequenos." };
  if (s >= 30) return { t: "Atenção", c: "bad", d: "Seus gastos estão consumindo quase tudo que entra." };
  return { t: "Crítico", c: "bad", d: "Prioridade total: parar o sangramento e organizar o básico." };
}

/* ---------------- dicas personalizadas ---------------- */
function gerarDicas(m) {
  var out = [];
  var r = receitas(m), d = despesas(m), renda = rendaReferencia(m);
  var tp = r > 0 ? (r - d) / r : 0;
  var cats = porCategoria(m);
  var mr = mesesReserva();
  var alvoRes = metaReserva();

  function add(tipo, titulo, texto, acao) { out.push({ tipo: tipo, titulo: titulo, texto: texto, acao: acao }); }

  if (r === 0 && d === 0) {
    add("blu", "Comece registrando 3 coisas", "Lance sua renda do mês, o aluguel (ou maior gasto fixo) e o gasto com mercado. Em 2 minutos você já vê para onde o dinheiro vai — e o app começa a calcular suas dicas.");
  }
  if (r > 0 && d > r) {
    add("red", "Você gastou mais do que recebeu", "Saíram " + fmt(d - r) + " a mais que a entrada deste mês. Se isso se repetir, a diferença vira dívida. Escolha 2 categorias não essenciais para cortar 30% até o fim do mês.");
  }
  if (r > 0 && tp < 0.1 && d <= r) {
    add("amb", "Taxa de poupança baixa (" + pct(tp * 100) + ")", "O ideal mínimo é guardar 10% de tudo que entra; 20% acelera muito. Faltam " + fmt(Math.max(0, r * 0.1 - (r - d))) + " para você chegar aos 10% neste mês.");
  }
  if (tp >= 0.2) {
    add("grn", "Ótima taxa de poupança (" + pct(tp * 100) + ")", "Você está guardando mais de 20% da renda — é o comportamento de quem constrói patrimônio. Automatize: transfira no dia do recebimento, antes de gastar.");
  }
  if (alvoRes > 0 && mr < 3) {
    add("red", "Reserva de emergência em " + mr.toFixed(1).replace(".", ",") + " meses", "O mínimo de segurança é 3 meses de custo essencial (" + fmt(custoEssencial() * 3) + "); o ideal é " + (S.config.metaReservaMeses || 6) + " meses (" + fmt(alvoRes) + "). Faltam " + fmt(Math.max(0, alvoRes - num(S.reserva.atual))) + ".");
  } else if (alvoRes > 0 && mr >= 6) {
    add("grn", "Reserva sólida (" + mr.toFixed(1).replace(".", ",") + " meses)", "Com esse colchão você pode assumir mais risco: estude Tesouro IPCA+, CDB e fundos de índice. Mantenha de 3 a 6 meses em liquidez diária e invista o excedente.");
  }
  if (dividaMensal() > 0 && renda > 0 && dividaMensal() / renda > 0.3) {
    add("red", "Parcelas comprometem " + pct((dividaMensal() / renda) * 100) + " da renda", "Acima de 30% é zona de risco: qualquer imprevisto vira atraso. Não assuma novas parcelas e tente alongar ou trocar dívida caro por mais barata.");
  }
  var caras = S.dividas.filter(function (x) { return num(x.jurosMes) >= 5 && saldoDevedor(x) > 0; });
  if (caras.length) {
    add("red", "Dívida com juros altos: " + caras[0].nome, "Custo de " + pct(num(caras[0].jurosMes)) + " ao mês equivale a " + pct((Math.pow(1 + num(caras[0].jurosMes) / 100, 12) - 1) * 100) + " ao ano. Cartão e cheque especial devem ser quitados antes de qualquer investimento.");
  }
  var estouradas = catsDe("despesa").filter(function (c) { return num(c.orcamento) > 0 && gastoNaCategoria(m, c.nome) > num(c.orcamento); });
  estouradas.slice(0, 2).forEach(function (c) {
    var g = gastoNaCategoria(m, c.nome);
    add("red", "Orçamento estourado em " + c.nome, "Você definiu " + fmt(c.orcamento) + " e já gastou " + fmt(g) + " (" + pct((g / num(c.orcamento)) * 100) + "). Reveja os lançamentos ou ajuste o limite para um valor realista.");
  });
  var quase = catsDe("despesa").filter(function (c) { var g = gastoNaCategoria(m, c.nome); return num(c.orcamento) > 0 && g <= num(c.orcamento) && g >= num(c.orcamento) * 0.8; });
  if (quase.length) {
    add("amb", "Quase no limite: " + quase[0].nome, "Já usou " + pct((gastoNaCategoria(m, quase[0].nome) / num(quase[0].orcamento)) * 100) + " do orçamento de " + quase[0].nome + ". Restam " + fmt(num(quase[0].orcamento) - gastoNaCategoria(m, quase[0].nome)) + " para o resto do mês.");
  }
  if (cats.length) {
    var total = cats.reduce(function (a, c) { return a + c.valor; }, 0);
    var top = cats[0];
    if (total > 0 && top.valor / total >= 0.4 && total > 0) {
      add("amb", top.nome + " concentra " + pct((top.valor / total) * 100) + " das saídas", fmt(top.valor) + " de " + fmt(total) + ". Concentração alta em uma categoria costuma esconder gastos pequenos e repetidos. Abra o relatório e olhe os lançamentos dela um por um.");
    }
  }
  var assin = gastoNaCategoria(m, "Assinaturas");
  if (assin > 0) {
    add("amb", "Assinaturas: " + fmt(assin) + "/mês", "São " + fmt(assin * 12) + " por ano. Liste todos os serviços e cancele os que você não usou nos últimos 30 dias — é o corte mais rápido e indolor que existe.");
  }
  var lazer = gastoNaCategoria(m, "Lazer") + gastoNaCategoria(m, "Outros");
  if (r > 0 && lazer / r > 0.25) {
    add("amb", "Lazer + Outros = " + pct((lazer / r) * 100) + " da renda", "Uma referência saudável é até 15% em prazeres variáveis. Reduzir para esse patamar liberaria " + fmt(Math.max(0, lazer - r * 0.15)) + " por mês para a reserva.");
  }
  var fixos = gastosFixos(m);
  if (d > 0 && fixos / d > 0.6) {
    add("amb", "Gastos fixos = " + pct((fixos / d) * 100) + " das despesas", "Quanto maior a fatia fixa, menos flexibilidade você tem. Renegocie aluguel, internet, plano de celular e seguros uma vez por ano — sempre é possível achar 5% a 15%.");
  }
  if (r === 0) {
    add("blu", "Sem receita lançada neste mês", "Lance salário, extras e reembolsos para o app calcular sua taxa de poupança e o limite real de cada categoria.");
  }
  if (S.metas.length) {
    var metaSemAporte = S.metas.filter(function (mt) { return !num(mt.aporteMensal) && num(mt.atual) < num(mt.alvo); });
    if (metaSemAporte.length) add("blu", "Meta sem aporte definido: " + metaSemAporte[0].nome, "Defina um valor mensal para ela. Sem aporte planejado, a meta vira intenção.");
  }
  if (S.dividas.length === 0 && num(S.reserva.atual) === 0) {
    add("blu", "Monte o básico em 3 caixas", "Caixa 1: contas do mês. Caixa 2: reserva de emergência. Caixa 3: sonhos/metas. Separe o dinheiro fisicamente (ou em contas diferentes) — é o hábito que mais funciona.");
  }
  if (out.length === 0) add("grn", "Tudo sob controle por aqui", "Nenhum alerta no mês. Aproveite para revisar seus objetivos de longo prazo e aumentar o aporte em 1% da renda.");
  return out;
}

/* ---------------- gráficos (SVG puro) ---------------- */
function donut(items, size) {
  size = size || 190;
  var total = items.reduce(function (a, i) { return a + i.valor; }, 0);
  if (!total) return '<div class="empty">Sem despesas neste mês.<br>Lance um gasto para ver o gráfico.</div>';
  var r = size / 2 - 12, c = 2 * Math.PI * r, off = 0;
  var segs = items.map(function (i) {
    var len = (i.valor / total) * c;
    var s = '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + i.cor + '" stroke-width="16" stroke-dasharray="' + len.toFixed(2) + ' ' + (c - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"><title>' + esc(i.nome) + ": " + fmt(i.valor) + "</title></circle>";
    off += len; return s;
  }).join("");
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" style="width:100%;max-width:' + size + 'px;display:block;margin:0 auto">' + segs +
    '<text x="' + size / 2 + '" y="' + (size / 2 - 4) + '" text-anchor="middle" fill="#8ea3b9" font-size="10.5" font-family="system-ui">SAÍDAS</text>' +
    '<text x="' + size / 2 + '" y="' + (size / 2 + 15) + '" text-anchor="middle" fill="#e8eef5" font-size="15" font-weight="700" font-family="system-ui">' + fmtK(total) + "</text></svg>";
}
function barrasMeses(meses, containerH) {
  var h = containerH || 200, w = 620, pad = 26, bw = (w - pad * 2) / meses.length;
  var vals = [];
  meses.forEach(function (m) { vals.push(receitas(m), despesas(m)); });
  var max = Math.max.apply(null, vals.concat([1]));
  var bars = "", labels = "";
  meses.forEach(function (m, i) {
    var x = pad + i * bw, rw = bw * 0.3;
    var hr = (receitas(m) / max) * (h - 52), hd = (despesas(m) / max) * (h - 52);
    bars += '<rect x="' + (x + bw * 0.12) + '" y="' + (h - 30 - hr) + '" width="' + rw + '" height="' + Math.max(1, hr) + '" rx="3" fill="#10b981" opacity=".85"><title>' + nomeMes(m) + " · entradas " + fmt(receitas(m)) + "</title></rect>";
    bars += '<rect x="' + (x + bw * 0.12 + rw + 3) + '" y="' + (h - 30 - hd) + '" width="' + rw + '" height="' + Math.max(1, hd) + '" rx="3" fill="#fb7185" opacity=".85"><title>' + nomeMes(m) + " · saídas " + fmt(despesas(m)) + "</title></rect>";
    labels += '<text x="' + (x + bw / 2) + '" y="' + (h - 10) + '" text-anchor="middle" fill="#61748a" font-size="10.5" font-family="system-ui">' + mesCurto(m) + "</text>";
  });
  return '<svg viewBox="0 0 ' + w + " " + h + '" style="width:100%;height:auto">' + bars + labels + "</svg>";
}
function anel(p, size) {
  size = size || 96; var r = size / 2 - 7, c = 2 * Math.PI * r;
  var len = clamp(p, 0, 1) * c;
  var cor = p >= 0.999 ? "#34d399" : p > 0.7 ? "#fbbf24" : "#fb7185";
  return '<svg viewBox="0 0 ' + size + " " + size + '" style="width:' + size + 'px;height:' + size + 'px">' +

  h += '<div class="stat-mini"><span>' + (ehAtual ? "Dias restantes no mês" : "Mês fechado") + "</span><b>" + (ehAtual ? diasRest : "—") + "</b></div>";
  h += '<div class="hint" style="margin-top:8px">' + (ehAtual && diasRest ? (seguroDia > 0 ? "Reservando 20% da renda, sobram " + fmt(folga) + " para os " + diasRest + " dias restantes." : "Sem folga: o que falta do mês já está comprometido. Segure os gastos variáveis.") : "Compare este mês com o anterior na aba Relatórios.") + "</div>";

function kpi(lbl, val, sub, cls) {

/* ---------------- lançamentos ---------------- */
function viewLancamentos() {

    kpi("Saldo devedor", fmt(total), S.dividas.length + " dívida(s) ativa(s)", "neg") +
    kpi("Pago por mês", fmt(mensal), renda > 0 ? pct(comp * 100) + " da renda" : "informe sua renda", comp > .3 ? "neg" : "") +
    kpi("Comprometimento", pct(comp * 100), comp > .3 ? "acima do limite seguro (30%)" : "dentro do limite seguro", comp > .3 ? "neg" : "pos") + "</div>";

  if (!S.dividas.length) {
    h += '<div class="card"><div class="empty">Nenhuma dívida cadastrada. 🎉<br><span class="hint">Se você tem cartão parcelado, empréstimo ou financiamento, cadastre aqui: o app calcula quanto de juros você ainda vai pagar e em quanto tempo quita.</span><br><br><button class="btn" data-act="nova-div">Cadastrar primeira dívida</button></div></div>';

    h += '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px"><div><div class="hint">Saldo devedor</div><div style="font-size:20px;font-weight:680" class="neg">' + fmt(saldo) + '</div></div><div style="text-align:right"><div class="hint">Parcela</div><div style="font-size:15px;font-weight:650">' + fmt(d.valorParcela) + "/mês</div></div></div>";

  var comp = [["Receitas", receitas(mes), receitas(ant)], ["Despesas", despesas(mes), despesas(ant)], ["Resultado", saldoMes(mes), saldoMes(ant)], ["Taxa de poupança", taxaPoupanca(mes) * 100, taxaPoupanca(ant) * 100]];
  h += '<div class="card"><div class="card-h"><h3>Este mês x mês anterior</h3><span>' + mesCurto(mes) + " vs " + mesCurto(ant) + "</span></div><div class=\"tbl-wrap\"><table><thead><tr><th></th><th>" + mesCurto(mes) + '</th><th>' + mesCurto(ant) + "</th><th>Δ</th></tr></thead><tbody>";
  comp.forEach(function (l) {
    var isPctRow = l[0].indexOf("Taxa") === 0;
    var a = l[1], b = l[2], dif = a - b;
    var difTxt = isPctRow ? (dif >= 0 ? "+" : "") + pct(dif) : (dif === 0 ? "—" : (dif > 0 ? "+" : "−") + fmt(Math.abs(dif)));
    var cls = l[0] === "Despesas" ? (dif > 0 ? "neg" : "pos") : dif >= 0 ? "pos" : "neg";
    h += "<tr><td>" + l[0] + "</td><td><b>" + (isPctRow ? pct(a) : fmt(a)) + "</b></td><td>" + (isPctRow ? pct(b) : fmt(b)) + '</td><td class="' + cls + '">' + difTxt + "</td></tr>";
  });
  h += "</tbody></table></div>";
  var m3 = [0, 1, 2].map(function (i) { return despesas(addMeses(mes, -i)); }).filter(function (v) { return v > 0; });
  var media = m3.length ? m3.reduce(function (a, b) { return a + b; }, 0) / m3.length : 0;
  h += '<div class="stat-mini" style="margin-top:10px"><span>Média de despesas (últimos 3 meses)</span><b>' + fmt(media) + "</b></div>";
  h += '<div class="stat-mini"><span>Projeção anual de despesas</span><b>' + fmt(media * 12) + "</b></div>";
  h += "</div></div>";

  /* tabela 12 meses */
  h += '<div class="card" style="margin-top:14px"><div class="card-h"><h3>Histórico completo</h3><button class="btn ghost sm" data-act="export-csv">⤓ CSV</button></div><div class="tbl-wrap"><table><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Saldo</th><th>Poupança</th></tr></thead><tbody>';
  meses.slice().reverse().forEach(function (mm) {
    var r = receitas(mm), d = despesas(mm), s = r - d, t = taxaPoupanca(mm);
    if (r === 0 && d === 0) return;
    h += "<tr><td>" + nomeMes(mm) + "</td><td class=\"pos\">" + fmt(r) + '</td><td class="neg">' + fmt(d) + '</td><td class="' + (s >= 0 ? "pos" : "neg") + '"><b>' + fmt(s) + "</b></td><td>" + (r > 0 ? pct(t * 100) : "—") + "</td></tr>";
  });
  h += "</tbody></table></div></div>";
  return h;
}

    h += '<div class="card"><div class="card-h"><h3>Análise de ' + nomeMes(mesRef) + "</h3><span>" + dicas.length + " observações</span></div>";
    dicas.forEach(function (d) { h += tipHTML(d); });
    h += '<div class="hint" style="margin-top:8px">As dicas são recalculadas a cada lançamento. Quanto mais dados você registra, mais precisas elas ficam.</div></div>';
    return h;
  }

  h += '<div class="card" style="margin-bottom:14px"><div class="tools" style="justify-content:space-between">' +
    '<input type="text" id="buscaEdu" placeholder="Buscar assunto: reserva, cartão, juros, tesouro..." value="' + esc(buscaEdu) + '" style="max-width:420px;flex:1">' +
    '<span class="pill mut">' + items.length + " artigos</span></div></div>";

  if (!items.length) { h += '<div class="empty">Nada encontrado. Tente outro termo.</div>'; return h; }

  var cats = {};
  items.forEach(function (a) { (cats[a.cat] = cats[a.cat] || []).push(a); });
  Object.keys(cats).forEach(function (c) {
    h += '<div class="sec-title">' + c + "</div>";
    h += '<div class="edu-grid">';
    cats[c].forEach(function (a) {
      h += '<div class="edu-card" data-act="edu" data-v="' + a.id + '"><span class="tag">' + a.cat + "</span><h4>" + esc(a.titulo) + "</h4><p>" + esc(a.resumo) + "</p>" +
        '<div class="meta"><span>' + a.min + " min de leitura</span><span>ler →</span></div></div>";
    });
    h += "</div>";
  });
  h += '<div class="hint" style="margin-top:14px">Conteúdo educacional, sem recomendação individual de investimento. Taxas citadas são referências históricas e podem variar.</div>';
  return h;
}

function exportarCSV(soMes) {
  var tx = soMes ? txMes(mesRef) : S.transacoes.slice();
  if (!tx.length) { toast("Nada para exportar"); return; }
  tx.sort(function (a, b) { return a.data < b.data ? -1 : 1; });
  var linhas = ["Data;Tipo;Categoria;Descricao;Metodo;Recorrente;Valor"];
  tx.forEach(function (t) {
    linhas.push([t.data, t.tipo, (t.categoria || ""), (t.descricao || "").replace(/;/g, ","), t.metodo || "", t.fixa ? "sim" : "nao", String(num(t.valor)).replace(".", ",")].join(";"));
  });
  var blob = new Blob(["\ufeff" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "lancamentos-" + (soMes ? mesRef : "completo") + ".csv";

}

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var a = el.getAttribute("data-act"), v = el.getAttribute("data-v");
  if (a === "overlay") { if (e.target.classList.contains("overlay")) closeModal(); return; }
  if (a === "close-modal") { closeModal(); return; }
  if (a === "nav") { secao = v; closeModal(); render(); window.scrollTo(0, 0); return; }
  if (a === "novo-tx") { abrirNovoLancamento(); return; }
  if (a === "set-tipo") {
    document.getElementById("inTipo").value = v;
    document.getElementById("selCat").innerHTML = catOptions(v, "");
    document.getElementById("btDes").className = v === "despesa" ? "on des" : "";
    document.getElementById("btRec").className = v === "receita" ? "on rec" : "";
    return;
  }
  if (a === "edit-tx") { var tx = S.transacoes.find(function (t) { return t.id === v; }); if (tx) abrirNovoLancamento(tx); return; }
  if (a === "del-tx") {
    var t2 = S.transacoes.find(function (t) { return t.id === v; });
    if (!t2) return;
    if (confirm('Excluir "' + (t2.descricao || t2.categoria) + '" de ' + fmt(t2.valor) + "?")) {
      S.transacoes = S.transacoes.filter(function (t) { return t.id !== v; });
      salvar(); closeModal(); render(); toast("Lançamento excluído");
    }
    return;
  }
  if (a === "filtro-tipo") { filtroTrans.tipo = v; render(); return; }
  if (a === "repetir-fixos") {
    var ant = mesPassado(mesRef);
    var fixos = txMes(ant).filter(function (t) { return t.fixa; });
    if (!fixos.length) { toast("Nenhum lançamento recorrente em " + mesCurto(ant)); return; }
    var jaTem = txMes(mesRef).filter(function (t) { return t.fixa; }).length;
    if (jaTem) { toast("Este mês já tem lançamentos recorrentes"); return; }
    var dia = Math.min(new Date().getDate(), diasNoMes(mesRef));
    fixos.forEach(function (t) {
      S.transacoes.push({ id: uid("t"), tipo: t.tipo, categoria: t.categoria, valor: t.valor, data: mesRef + "-" + String(Math.min(num(diaDe(t.data)), diasNoMes(mesRef))).padStart(2, "0"), descricao: t.descricao, metodo: t.metodo, fixa: true });
    });
    salvar(); render(); toast(fixos.length + " lançamentos fixos copiados");
    return;
  }
  if (a === "sugerir-orcamento") {

    Object.keys(sug).forEach(function (nome) {

    return;
  }
  if (a === "nova-div") { abrirDivida(); return; }

  if (a === "del-div") {
    if (confirm("Excluir esta dívida?")) { S.dividas = S.dividas.filter(function (x) { return x.id !== v; }); salvar(); render(); toast("Dívida excluída"); }
    return;
  }

  if (a === "demo-confirmar") { carregarDemo(); return; }
  if (a === "reset") {
    openModal("Apagar todos os dados", '<div class="prose"><p>Isso remove <b>todos</b> os lançamentos, dívidas, metas e a reserva deste navegador. Não é possível desfazer.</p></div><div style="display:flex;gap:9px;margin-top:14px"><button class="btn danger" data-act="reset-confirmar">Apagar tudo</button><button class="btn ghost" data-act="close-modal">Cancelar</button></div>');
    return;
  }
  if (a === "reset-confirmar") { S = estadoInicial(); salvar(); closeModal(); secao = "dashboard"; render(); toast("Tudo apagado. Comece de novo."); return; }
});

function abrirParcela(id) {
  var d = S.dividas.find(function (x) { return x.id === id; }); if (!d) return;
  var rest = Math.max(0, num(d.parcelasTotal) - num(d.parcelasPagas));
  openModal("Registrar parcela paga — " + esc(d.nome),
    '<form data-form="parcela"><input type="hidden" name="id" value="' + id + '">' +
    '<div class="hint">Parcela de ' + fmt(d.valorParcela) + " · " + num(d.parcelasPagas) + " de " + num(d.parcelasTotal) + " pagas (" + rest + " restantes)</div>" +
    '<div style="margin-top:12px"><label class="chk"><input type="checkbox" name="lancar" checked> Lançar também como despesa em ' + nomeMes(mesRef) + "</label></div>" +
    '<div class="hint" style="margin-top:8px">Lançar como despesa mantém seus relatórios e sua taxa de poupança corretos.</div>' +
    '<div style="display:flex;gap:9px;margin-top:16px"><button class="btn" type="submit">Confirmar pagamento</button><button class="btn ghost" type="button" data-act="close-modal">Cancelar</button></div></form>');
}

document.addEventListener("submit", function (e) {
  var f = e.target.closest("[data-form]");
  if (!f) return;
  e.preventDefault();
  var tipoForm = f.getAttribute("data-form");
  var d = {};
  new FormData(f).forEach(function (val, k) { d[k] = val; });

  if (tipoForm === "tx") {
    var valor = num(d.valor);
    if (valor <= 0) { toast("Informe um valor maior que zero"); return; }
    var obj = {
      id: d.id || uid("t"), tipo: d.tipo, categoria: d.categoria, valor: valor, data: d.data,
      descricao: (d.descricao || "").trim() || d.categoria, metodo: d.metodo, fixa: !!d.fixa
    };
    if (d.id) { var i0 = S.transacoes.findIndex(function (t) { return t.id === d.id; }); if (i0 > -1) S.transacoes[i0] = obj; }
    else S.transacoes.push(obj);
    mesRef = mesDe(obj.data);
    salvar(); closeModal(); render(); toast(d.id ? "Lançamento atualizado" : "Lançamento adicionado");
    return;
  }
  if (tipoForm === "divida") {
    var dd = {
      id: d.id || uid("d"), nome: (d.nome || "").trim() || "Dívida",
      valorTotal: num(d.valorTotal), valorParcela: num(d.valorParcela),
      parcelasTotal: Math.max(1, parseInt(d.parcelasTotal, 10) || 1),
      parcelasPagas: Math.max(0, parseInt(d.parcelasPagas, 10) || 0),
      jurosMes: num(d.jurosMes), vencimentoDia: parseInt(d.vencimentoDia, 10) || ""
    };
    if (dd.valorTotal <= 0 || dd.valorParcela <= 0) { toast("Preencha valor total e parcela"); return; }
    if (d.id) { var i1 = S.dividas.findIndex(function (x) { return x.id === d.id; }); if (i1 > -1) S.dividas[i1] = dd; }
    else S.dividas.push(dd);
    salvar(); closeModal(); render(); toast("Dívida salva");
    return;
  }
  if (tipoForm === "meta") {
    var mt = {
      id: d.id || uid("m"), nome: (d.nome || "").trim() || "Meta", alvo: num(d.alvo), atual: num(d.atual),
      aporteMensal: num(d.aporteMensal), prazo: d.prazo || ""
    };
    if (mt.alvo <= 0) { toast("Informe o valor alvo"); return; }
    if (d.id) { var i2 = S.metas.findIndex(function (x) { return x.id === d.id; }); if (i2 > -1) S.metas[i2] = mt; }
    else S.metas.push(mt);
    salvar(); closeModal(); render(); toast("Meta salva");
    return;
  }
  if (tipoForm === "aporte-meta") {
    var val = num(d.valor); if (val <= 0) { toast("Informe um valor"); return; }
    var mt2 = S.metas.find(function (x) { return x.id === d.id; });
    if (mt2) { mt2.atual = num(mt2.atual) + val; salvar(); closeModal(); render(); toast(fmt(val) + " aportados em " + mt2.nome); }
    return;
  }
  if (tipoForm === "parcela") {
    var dv = S.dividas.find(function (x) { return x.id === d.id; }); if (!dv) return;
    dv.parcelasPagas = Math.min(num(dv.parcelasTotal), num(dv.parcelasPagas) + 1);
    if (d.lancar === "on") {
      S.transacoes.push({ id: uid("t"), tipo: "despesa", categoria: "Dívidas e juros", valor: num(dv.valorParcela), data: mesRef + "-" + String(Math.min(num(dv.vencimentoDia) || 10, diasNoMes(mesRef))).padStart(2, "0"), descricao: "Parcela — " + dv.nome, metodo: "Boleto", fixa: true });
    }
    salvar(); closeModal(); render(); toast("Parcela registrada");
    return;
  }
  if (tipoForm === "cat") {
    var nome = (d.nome || "").trim();
    if (!nome) { toast("Digite um nome"); return; }
    if (S.categorias.some(function (c) { return c.nome.toLowerCase() === nome.toLowerCase(); })) { toast("Categoria já existe"); return; }
    S.categorias.push({ nome: nome, tipo: d.tipo, orcamento: 0, cor: CORES[S.categorias.length % CORES.length] });
    salvar(); render(); toast("Categoria adicionada");
    return;
  }
  if (tipoForm === "config") {
    S.config.nome = (d.nome || "").trim();
    S.config.rendaMensal = num(d.rendaMensal);
    S.config.custoEssencial = num(d.custoEssencial);
    S.config.metaReservaMeses = clamp(parseInt(d.metaReservaMeses, 10) || 6, 1, 36);
    salvar(); render(); toast("Perfil salvo");
    return;
  }
});

document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.id === "inCusto") { S.config.custoEssencial = num(t.value); salvar(); render(); toast("Custo essencial atualizado"); }
  if (t.id === "inMeses") { S.config.metaReservaMeses = parseInt(t.value, 10); salvar(); render(); toast("Meta de reserva: " + t.value + " meses"); }
  if (t.id === "fileImport" && t.files && t.files[0]) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var obj = JSON.parse(fr.result);
        if (!obj || !obj.transacoes) throw new Error("formato");
        S = Object.assign(estadoInicial(), obj);
        salvar(); render(); toast("Backup importado");
      } catch (err) { toast("Arquivo inválido"); }
    };
    fr.readAsText(t.files[0]);
  }
});

document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

/* ---------------- abertura ---------------- */
function abertura() {
  var visto = false;
  try { visto = !!localStorage.getItem(LS + "_onboard"); } catch (e) {}
  if (visto) return;
  try { localStorage.setItem(LS + "_onboard", "1"); } catch (e) {}
  openModal("Bem-vindo ao seu controle financeiro",
    '<div class="prose"><p>Este app registra <b>tudo que entra e sai</b>, calcula sua <b>reserva de emergência</b>, acompanha <b>dívidas</b> e te dá <b>dicas personalizadas</b> a partir dos seus números.</p>' +
    "<h4>Comece em 3 passos</h4><ol><li>Vá em <b>Lançamentos</b> e registre sua renda do mês e seu maior gasto fixo.</li><li>Em <b>Reserva e metas</b>, informe seu custo essencial mensal.</li><li>Volte à <b>Visão geral</b>: sua saúde financeira, os gráficos e as dicas já aparecem.</li></ol>" +
    "<div class='box'>Tudo fica salvo apenas neste navegador. Faça backup em Ajustes de vez em quando.</div>" +
    "<p>Quer ver o app cheio primeiro? Você pode carregar dados de exemplo e apagar depois.</p></div>" +
    '<div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;justify-content:center"><button class="btn" data-act="close-modal">Começar do zero</button><button class="btn ghost" data-act="demo">Ver com dados de exemplo</button></div>');
}

/* ---------------- PWA: instalação e offline ---------------- */
var promptInstalar = null;
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); promptInstalar = e; });
window.addEventListener("appinstalled", function () { promptInstalar = null; toast("App instalado!"); });

function instalarApp() {
  if (promptInstalar) {
    promptInstalar.prompt();
    promptInstalar.userChoice.then(function (r) {
      if (r && r.outcome === "accepted") { toast("Instalando..."); promptInstalar = null; }
    });
    return;
  }
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var jaInstalado = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (jaInstalado) { openModal("App já instalado", '<div class="prose"><p>Este app já está aberto em modo aplicativo. O atalho está na sua tela inicial.</p></div><div style="margin-top:14px"><button class="btn" data-act="close-modal">Fechar</button></div>'); return; }
  openModal("Como instalar", '<div class="prose">' +
    (ios
      ? "<p><b>No iPhone/iPad (Safari):</b></p><ol><li>Toque no ícone <b>Compartilhar</b> (quadrado com a flecha).</li><li>Escolha <b>Adicionar à Tela de Início</b>.</li><li>Confirme em <b>Adicionar</b>.</li></ol>"
      : "<p><b>No Android (Chrome):</b></p><ol><li>Toque no menu <b>⋮</b> no canto superior direito.</li><li>Escolha <b>Instalar aplicativo</b> ou <b>Adicionar à tela inicial</b>.</li><li>Confirme em <b>Instalar</b>.</li></ol>") +
    '<p><b>No computador (Chrome/Edge):</b> clique no ícone de instalação na barra de endereços, ou menu ⋮ → "Instalar Minha Carteira".</p>' +
    "</div>" +
    '<div style="display:flex;gap:9px;margin-top:14px"><button class="btn ghost" data-act="close-modal">Entendi</button></div>');
}

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("./sw.js").catch(function () {});
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

render();
abertura();

</script>
</body>
</html>
